project:
  name: "ecommerce_lakehouse"
  environment: "prod"

paths:
  raw:
    orders_initial: "raw/orders_initial.csv"
    orders_updates: "raw/orders_updates.csv"
    inventory_initial: "raw/inventory_initial.csv"
    inventory_movements: "raw/inventory_movements.csv"
  bronze:
    orders_initial: "processed/bronze/orders_initial/"
    orders_updates: "processed/bronze/orders_updates/"
    inventory_initial: "processed/bronze/inventory_initial/"
    inventory_movements: "processed/bronze/inventory_movements/"
  quarantine:
    orders_initial: "processed/quarantine/orders_initial/"
    orders_updates: "processed/quarantine/orders_updates/"
    inventory_initial: "processed/quarantine/inventory_initial/"
    inventory_movements: "processed/quarantine/inventory_movements/"
  silver:
    orders: "processed/silver/orders/"
    inventory: "processed/silver/inventory/"
    movements: "processed/silver/inventory_movements/"
  gold:
    orders_by_status: "processed/gold/orders_by_status/"
    revenue_paid_orders: "processed/gold/revenue_paid_orders/"
    top_ordered_products: "processed/gold/top_ordered_products/"
    low_stock_products: "processed/gold/low_stock_products/"
    paid_unshipped_orders: "processed/gold/paid_unshipped_orders/"
    inventory_movement_summary: "processed/gold/inventory_movement_summary/"

hudi:
  orders:
    table_name: "orders_hudi"
    record_key: "order_id"
    precombine_field: "ordering_key"
    table_type: "COPY_ON_WRITE"
  inventory:
    table_name: "inventory_hudi"
    record_key: "product_id"
    precombine_field: "ordering_key"
    table_type: "COPY_ON_WRITE"
  movements:
    table_name: "inventory_movements_hudi"
    record_key: "movement_id"
    precombine_field: "ordering_key"
    table_type: "COPY_ON_WRITE"

validation_rules:
  valid_order_statuses:
    - "PLACED"
    - "CONFIRMED"
    - "SHIPPED"
    - "DELIVERED"
    - "CANCELLED"
  valid_payment_statuses:
    - "PENDING"
    - "PAID"
    - "FAILED"
    - "REFUNDED"
  valid_movement_types:
    - "PURCHASE"
    - "RETURN"
    - "RESTOCK"
    - "DAMAGE"
  valid_categories:
    - "APPAREL"
    - "ELECTRONICS"
    - "SPORTS"
    - "HOME"
    - "BOOKS"
  low_stock_threshold: 20
